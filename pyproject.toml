[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calcx-advanced"
version = "2.0.0"
description = "Safe scientific command-line calculator"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Genesis GZ", email = "genzt.dev@pm.me"}]
dependencies = []

[project.optional-dependencies]
precision = ["mpmath>=1.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
calcx = "calcx.cli:main"

[tool.setuptools.packages.find]
include = ["calcx*"]
