name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with: {languages: python}
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${version}"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" git --redact --exit-code 1 --no-banner .
