name: CalcX CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix: {os: [ubuntu-latest, macos-latest], python: ['3.10', '3.12', '3.13']}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with: {python-version: ${{ matrix.python }}}
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q calcx
      - run: bash -n calcx.sh
      - run: bash tests/run_tests.sh
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with: {python-version: '3.12'}
      - run: python -m pip install build
      - run: python -m build
